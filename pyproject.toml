[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "juris-radar"
version = "0.1.0"
description = "PoC educacional de consultas processuais via API Pública DataJud (TJPE)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
jurisradar = "jurisradar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
